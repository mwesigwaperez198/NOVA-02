services:
  - type: web
    name: quickshop-ug
    env: php
    plan: free
    branch: main
    buildCommand: composer install --no-dev --optimize-autoloader 2>/dev/null || true
    startCommand: php -S 0.0.0.0:$PORT -t .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Africa/Kampala
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: BASE_URL
        sync: false
